dataset:
  name: masking_debug
  description: "Strong+weak target pairs, RESOLVABLE (>mainlobe) but inside one CFAR training window — the case where CA masks the weak target and OS should not."
  output_root: data
  num_frames: 40
  random_seed: 2001

targets:
  mode: close_pair

  base_range_m:
    min: 25.0
    max: 75.0

  base_velocity_mps:
    min: -8.0
    max: 8.0

  # Separation: > mainlobe (~2-3 bins, so the weak target is RESOLVABLE — it has its own
  # peak) but < the training half-width (guard+train = 10 bins, so the strong target sits in
  # the weak target's TRAINING ring and inflates a CA mean estimate -> masking).
  separation:
    range_bins:
      min: 5
      max: 9
    velocity_bins:
      min: 0
      max: 3

  # Strong dominant target + a weaker one that is detectable on its own (cell SNR = scene
  # snr_db + amplitude_db, so weak ~ 12-16 dB, strong ~ 24-28 dB).
  amplitude_db:
    strong:
      min: 12.0
      max: 16.0
    weak:
      min: 0.0
      max: 4.0

scene:
  snr_db:
    mode: fixed
    value: 12.0

  clutter:
    enabled: false
    strength_db: -18.0
    width_bins: 3

  multipath:
    enabled: false
    delay_m: 2.0
    attenuation_db: -12.0

save:
  rd_map_db: true
  rd_map_mag: true
  label_mask: true
  labels_csv: true
  preview_png: true

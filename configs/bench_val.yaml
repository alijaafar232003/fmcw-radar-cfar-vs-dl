dataset:
  name: bench_val
  description: Stratified benchmark - VALIDATION. 8 conditions equal proportion, disjoint
    seed.
  output_root: data
  num_frames: 1600
  random_seed: 80002
targets:
  mode: random
  min_targets: 1
  max_targets: 3
  range_m:
    min: 8.0
    max: 110.0
  velocity_mps:
    min: -25.0
    max: 25.0
  amplitude_db:
    min: 6.0
    max: 26.0
  min_separation:
    range_bins: 12
    velocity_bins: 12
scene:
  snr_db:
    mode: random_uniform
    min: -2.0
    max: 16.0
  propagation:
    enabled: true
    ref_range_m: 50.0
    exponent_db: 40.0
  clutter:
    enabled: false
    strength_db: 45.0
    width_bins: 4
  multipath:
    enabled: false
    delay_m: 2.0
    attenuation_db: -12.0
  min_separation:
    range_bins: 12
    velocity_bins: 12
scenarios:
- name: isolated
  targets:
    mode: fixed_count
    count: 1
- name: masking
  targets:
    mode: close_pair
    base_range_m:
      min: 20.0
      max: 90.0
    base_velocity_mps:
      min: -12.0
      max: 12.0
    separation:
      range_bins:
        min: 5
        max: 9
      velocity_bins:
        min: 0
        max: 3
    amplitude_db:
      strong:
        min: 14.0
        max: 24.0
      weak:
        min: 2.0
        max: 10.0
- name: unresolved
  targets:
    mode: close_pair
    base_range_m:
      min: 20.0
      max: 90.0
    base_velocity_mps:
      min: -12.0
      max: 12.0
    separation:
      range_bins:
        min: 1
        max: 3
      velocity_bins:
        min: 0
        max: 1
    amplitude_db:
      strong:
        min: 14.0
        max: 24.0
      weak:
        min: 6.0
        max: 14.0
- name: clutter
  targets:
    mode: random
    min_targets: 1
    max_targets: 3
    velocity_mps:
      min: -5.0
      max: 5.0
  scene:
    clutter:
      enabled: true
      strength_db: 45.0
      width_bins: 4
- name: multi
  targets:
    mode: random
    min_targets: 4
    max_targets: 5
    min_separation:
      range_bins: 6
      velocity_bins: 6
  scene:
    min_separation:
      range_bins: 6
      velocity_bins: 6
- name: multipath
  targets:
    mode: random
    min_targets: 1
    max_targets: 2
  scene:
    multipath:
      enabled: true
      delay_m: 2.0
      attenuation_db: -12.0
- name: noise
  targets:
    mode: fixed_count
    count: 0
- name: mixed
  targets:
    mode: random
    min_targets: 0
    max_targets: 5
    min_separation:
      range_bins: 3
      velocity_bins: 3
  scene:
    clutter:
      enabled: true
      strength_db: 45.0
      width_bins: 4
    multipath:
      enabled: true
      delay_m: 2.0
      attenuation_db: -12.0
    min_separation:
      range_bins: 3
      velocity_bins: 3
save:
  compact: true
  preview_png: false

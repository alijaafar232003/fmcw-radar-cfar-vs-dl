dataset:
  name: noise_only_debug
  description: "No-target frames for CFAR false alarm testing."
  output_root: data
  num_frames: 10
  random_seed: 1002

targets:
  mode: fixed_count
  count: 0

scene:
  snr_db:
    mode: fixed
    value: 0.0

  clutter:
    enabled: false
    strength_db: -18.0
    width_bins: 3

  multipath:
    enabled: false
    delay_m: 2.0
    attenuation_db: -12.0

save:
  rd_map_db: true
  rd_map_mag: true
  label_mask: true
  labels_csv: true
  preview_png: true
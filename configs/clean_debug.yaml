dataset:
  name: clean_debug
  description: "Clean separated targets, high SNR, no clutter, no multipath."
  output_root: data
  num_frames: 10
  random_seed: 1001

targets:
  mode: random
  min_targets: 1
  max_targets: 3

  range_m:
    min: 10.0
    max: 90.0

  velocity_mps:
    min: -12.0
    max: 12.0

  amplitude_db:
    min: 8.0
    max: 15.0

scene:
  snr_db:
    mode: fixed
    value: 25.0

  clutter:
    enabled: false
    strength_db: -18.0
    width_bins: 3

  multipath:
    enabled: false
    delay_m: 2.0
    attenuation_db: -12.0

  min_separation:
    range_bins: 8
    velocity_bins: 6

save:
  rd_map_db: true
  rd_map_mag: true
  label_mask: true
  labels_csv: true
  preview_png: true
# CARRADA-INFORMED SYNTHETIC DOMAIN -- pilot
#
# AUTO-GENERATED by experiments/carrada_informed_domain/scripts/make_configs.py from
# configs/bench2_train.yaml
# Do not hand-edit: regenerate instead.
#
# Every target-side field -- the scenario list, target counts, placement, separations, amplitude
# ranges, the snr_db sweep, propagation, the strata and their equal proportions -- is copied
# VERBATIM from the original config. Only the `dataset` block (name, frame count, seed) and the
# `save` block differ.
#
# The BACKGROUND is what changes, and it does not live in this file. It is applied by
# scripts/carrada_sim.py, which patches candidate background synthesis into the frozen
# generator: multi-look averaging, the train-derived range profile, and a narrow zero-Doppler
# ridge in essentially every frame. The `scene.clutter` blocks below are inherited from the
# original and are IGNORED by that path -- the ridge model replaces them wholesale. They are
# left in place so the diff against the original stays minimal and auditable.
#
# save.complex is false, deliberately. A multi-look magnitude map is an incoherent power average
# and has no single complex counterpart; writing one look's complex map beside it would invite
# someone to treat the two as the same measurement.

dataset:
  name: carrada_informed_pilot
  description: CARRADA-informed background domain, pilot split. Targets and strata identical to bench2;
    background multi-look + range profile + narrow ridge, calibrated from CARRADA TRAIN only.
  output_root: data
  num_frames: 700
  random_seed: 770100
targets:
  mode: random
  min_targets: 1
  max_targets: 3
  range_m:
    min: 8.0
    max: 45.0
  velocity_mps:
    min: -8.0
    max: 8.0
  amplitude_db:
    min: 4.0
    max: 16.0
  min_separation:
    range_bins: 12
    velocity_bins: 6
scene:
  snr_db:
    mode: random_uniform
    min: -4.0
    max: 14.0
  propagation:
    enabled: true
    ref_range_m: 25.0
    exponent_db: 40.0
  clutter:
    enabled: false
  multipath:
    enabled: false
    delay_m: 2.0
    attenuation_db: -12.0
  min_separation:
    range_bins: 12
    velocity_bins: 6
scenarios:
- name: isolated
  targets:
    mode: fixed_count
    count: 1
- name: masking
  targets:
    mode: close_pair
    base_range_m:
      min: 8.0
      max: 40.0
    base_velocity_mps:
      min: -7.0
      max: 7.0
    separation:
      range_m:
        min: 0.4
        max: 2.5
      velocity_mps:
        min: 0.0
        max: 0.8
    amplitude_db:
      strong:
        min: 14.0
        max: 22.0
      weak:
        min: 2.0
        max: 10.0
- name: clutter
  targets:
    mode: random
    min_targets: 1
    max_targets: 3
    velocity_mps:
      min: -1.2
      max: 1.2
  scene:
    clutter:
      enabled: true
      cnr_db:
        min: 8.0
        max: 25.0
      width_bins: 3
      distribution: weibull
      shape:
        min: 1.1
        max: 2.0
- name: clutter_edge
  targets:
    mode: random
    min_targets: 1
    max_targets: 2
    velocity_mps:
      min: 2.5
      max: 4.2
      mirror: true
  scene:
    clutter:
      enabled: true
      cnr_db:
        min: 12.0
        max: 25.0
      width_bins: 3
      distribution: weibull
      shape:
        min: 1.1
        max: 2.0
- name: multi
  targets:
    mode: random
    min_targets: 4
    max_targets: 5
    min_separation:
      range_bins: 12
      velocity_bins: 6
  scene:
    min_separation:
      range_bins: 12
      velocity_bins: 6
- name: noise
  targets:
    mode: fixed_count
    count: 0
- name: mixed
  targets:
    mode: random
    min_targets: 0
    max_targets: 5
    min_separation:
      range_bins: 6
      velocity_bins: 3
  scene:
    clutter:
      enabled: true
      cnr_db:
        min: 5.0
        max: 22.0
      width_bins: 3
      distribution: weibull
      shape:
        min: 1.1
        max: 2.0
    multipath:
      enabled: true
      delay_m: 2.0
      attenuation_db: -12.0
    min_separation:
      range_bins: 6
      velocity_bins: 3
save:
  compact: true
  preview_png: false
  complex: false
